<p-dialog transitionOptions="250ms cubic-bezier(0, 0, 0.2, 1)" header="Card" (onHide)="dialogClosed()" [modal]="true" dismissableMask="true" [(visible)]="visible" [style]="{ width: '50rem' }">
  <p-card [style]="{  overflow: 'hidden' }">
    <ng-template #header>
      <img alt="Card" class="w-full" src="https://primefaces.org/cdn/primeng/images/card-ng.jpg" />
    </ng-template>
    <ng-template #title>{{cardData.title}}</ng-template>
    <ng-template #subtitle>{{cardData.subtitle}}</ng-template>
    <p>{{cardData.text}}</p>
    <ng-template #footer>
      <div class="flex gap-4 mt-1">
        <p-button label="Cancel" (mouseover)="dialogClosed()" severity="secondary" (click)="dialogClosed()" />
        <p-button label="Save" (click)="dialogClosed()" />
      </div>
    </ng-template>
  </p-card>
</p-dialog>
