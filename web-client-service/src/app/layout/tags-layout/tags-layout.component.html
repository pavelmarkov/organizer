<div class="card">
  <p-table [value]="tags" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Description</th>
      </tr>
    </ng-template>
    <ng-template #body let-tag>
      <tr>
        <td>{{ tag.name }}</td>
        <td>{{ tag.description }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
