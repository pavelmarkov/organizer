<app-actions-layout
  (processEvent)="processDirectory()"
  (importEvent)="importDirectoryFromFile($event)"
  (searchEvent)="searchDirectory()"
></app-actions-layout>

<tree-table-layout
  [rows]="files"
  [columns]="cols"
  [totalRecords]="totalRecords"
  [loading]="loading"
  [dataKeyName]="dataKeyName"
  [selectionKeys]="selectionKeys"

  (nodeExpandEvent)="onNodeExpand($event)"
  (showDialogEvent)="showDialog($event)"
  (loadNodesEvent)="loadNodes($event)"
></tree-table-layout>

<app-card-layout 
  (dialogPanelCloseEvent)="closeDialog()"
  (tagChangedEvent)="tagChanged($event)"
  (nextItemEvent)="nextItem($event)"
  (previousItemEvent)="previousItem($event)"
  [cardData]="cardData"
  [visible]="dialogPanelVisible">
</app-card-layout>
